<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>名單管理</title>
<style>
  body{margin:0;background:#f3f6fb;color:#1f2a37;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;line-height:1.6}
  .wrap{max-width:900px;margin:0 auto;padding:28px 18px 60px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#64748b;font-size:13px;margin:0 0 20px}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;
    box-shadow:0 1px 3px rgba(15,39,68,.06)}
  input[type=password],input[type=text]{padding:10px 12px;font-size:14px;font-family:inherit;
    border:1.5px solid #e2e8f0;border-radius:9px;background:#f8fafc;outline:none;min-width:240px}
  button{font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;border-radius:9px;
    padding:10px 14px;border:1.5px solid #e2e8f0;background:#fff;color:#475569}
  button.p{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
  button.d{border-color:#fecaca;color:#dc2626}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .stat{display:flex;gap:18px;margin:16px 0;font-size:14px}
  .stat b{font-size:22px;display:block;color:#0f2744}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13.5px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #eef2f7}
  th{font-size:12px;color:#64748b;font-weight:700}
  td.e{font-family:ui-monospace,monospace;font-size:12.5px}
  .tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px}
  .yes{background:#dcfce7;color:#15803d}.no{background:#f1f5f9;color:#94a3b8}
  .g{background:#dbeafe;color:#1d4ed8}.m{background:#fef3c7;color:#b45309}
  .err{color:#dc2626;font-size:13px;margin-top:10px}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>名單管理</h1>
  <p class="sub">fund-hub 的 Email 名單。請勿將此頁網址與金鑰外流。</p>

  <div id="gate" class="card">
    <div class="row">
      <input id="k" type="password" placeholder="管理金鑰" autocomplete="off">
      <button class="p" id="go">讀取</button>
    </div>
    <div id="err" class="err"></div>
  </div>

  <div id="main" class="card hide">
    <div class="row">
      <button class="p" id="csv">匯出 CSV</button>
      <button id="reload">重新讀取</button>
      <input id="q" type="text" placeholder="搜尋 Email 或稱呼">
    </div>
    <div class="stat">
      <div>總筆數<b id="t">—</b></div>
      <div>同意收信<b id="c">—</b></div>
    </div>
    <table><thead><tr>
      <th>Email</th><th>稱呼</th><th>驗證</th><th>行銷同意</th><th>加入時間</th><th></th>
    </tr></thead><tbody id="tb"></tbody></table>
  </div>
</div>

<script>
(function(){
  var $=function(i){return document.getElementById(i);};
  var KEY="fh-admin-key", rows=[];
  function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[m];});}
  function fmt(iso){ if(!iso) return ""; var d=new Date(iso); return isNaN(d)?iso:
    d.toLocaleString("zh-TW",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}); }
  function key(){ return sessionStorage.getItem(KEY)||""; }

  function paint(){
    var q=($("q").value||"").trim().toLowerCase();
    var list=rows.filter(function(r){
      if(!q) return true;
      return (r.email||"").toLowerCase().indexOf(q)>=0 || (r.name||"").toLowerCase().indexOf(q)>=0;
    });
    $("tb").innerHTML=list.map(function(r){
      return "<tr><td class=\"e\">"+esc(r.email)+"</td><td>"+esc(r.name||"")+"</td>"+
        "<td><span class=\"tag "+(r.via==="google"?"g":"m")+"\">"+(r.via==="google"?"Google":"自填")+"</span></td>"+
        "<td><span class=\"tag "+(r.consent?"yes":"no")+"\">"+(r.consent?"是":"否")+"</span></td>"+
        "<td>"+esc(fmt(r.at))+"</td>"+
        "<td><button class=\"d\" data-del=\""+esc(r.email)+"\">刪除</button></td></tr>";
    }).join("");
  }

  async function load(){
    var r=await fetch("/api/admin?action=list&key="+encodeURIComponent(key()));
    if(r.status===401){ throw new Error("金鑰不正確"); }
    var j=await r.json();
    if(j.error) throw new Error(j.error);
    rows=j.rows||[];
    $("t").textContent=j.total;
    $("c").textContent=j.consented;
    paint();
  }

  $("go").addEventListener("click", async function(){
    $("err").textContent="";
    sessionStorage.setItem(KEY, $("k").value.trim());
    try{ await load(); $("gate").classList.add("hide"); $("main").classList.remove("hide"); }
    catch(e){ $("err").textContent=String(e.message||e); }
  });
  $("k").addEventListener("keydown",function(e){ if(e.key==="Enter") $("go").click(); });
  $("reload").addEventListener("click",function(){ load().catch(function(e){ alert(e.message); }); });
  $("q").addEventListener("input", paint);
  $("csv").addEventListener("click", function(){
    location.href="/api/admin?action=csv&key="+encodeURIComponent(key());
  });
  document.addEventListener("click", async function(e){
    var b=e.target.closest("button[data-del]"); if(!b) return;
    var em=b.getAttribute("data-del");
    if(!confirm("刪除 "+em+" 的名單與自選清單？此動作無法復原。")) return;
    b.disabled=true;
    var r=await fetch("/api/admin?action=delete&email="+encodeURIComponent(em)+"&key="+encodeURIComponent(key()));
    var j=await r.json();
    if(j.error){ alert(j.error); b.disabled=false; return; }
    load();
  });

  if(key()){ $("k").value=key(); $("go").click(); }
})();
</script>
</body>
</html>
