<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>名單管理</title>
<style>
  :root{
    /* 全站共用的圓角與陰影刻度。要改尺寸只改這裡，別在個別規則裡寫死。 */
    --r-2xs:4px; --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
    --sh-0:0 1px 3px rgba(20,45,80,.07);
    --sh-1:0 1px 4px rgba(20,45,80,.06),0 6px 20px rgba(20,45,80,.07);
    --sh-2:0 2px 6px rgba(20,45,80,.08),0 16px 36px rgba(20,45,80,.10);
  }

  body{margin:0;background:#f3f6fb;color:#1f2a37;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;line-height:1.6}
  .wrap{max-width:900px;margin:0 auto;padding:28px 18px 60px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#64748b;font-size:13px;margin:0 0 20px}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:var(--r-md);padding:18px;
    box-shadow:var(--sh-0)}
  input[type=password],input[type=text]{padding:10px 12px;font-size:14px;font-family:inherit;
    border:1.5px solid #e2e8f0;border-radius:var(--r-sm);background:#f8fafc;outline:none;min-width:240px}
  button{font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;border-radius:var(--r-sm);
    padding:10px 14px;border:1.5px solid #e2e8f0;background:#fff;color:#475569}
  button.p{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
  button.d{border-color:#fecaca;color:#dc2626}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .stat{display:flex;gap:18px;margin:16px 0;font-size:14px}
  .stat b{font-size:22px;display:block;color:#0f2744}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13.5px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #eef2f7}
  th{font-size:12px;color:#64748b;font-weight:700}
  td.e{font-family:ui-monospace,monospace;font-size:12.5px}
  .tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:var(--r-pill)}
  .yes{background:#dcfce7;color:#15803d}.no{background:#f1f5f9;color:#94a3b8}
  .g{background:#dbeafe;color:#1d4ed8}.m{background:#fef3c7;color:#b45309}
  .stu{background:#ede9fe;color:#6d28d9}.tri{background:#f1f5f9;color:#475569}.exp{background:#fee2e2;color:#dc2626}
  textarea{width:100%;box-sizing:border-box;min-height:120px;padding:10px 12px;font-size:13px;
    font-family:ui-monospace,monospace;border:1.5px solid #e2e8f0;border-radius:var(--r-sm);background:#f8fafc;outline:none}
  h2{font-size:15px;margin:0 0 4px}
  .hint{color:#64748b;font-size:12.5px;margin:0 0 10px}
  .mt{margin-top:16px}
  .err{color:#dc2626;font-size:13px;margin-top:10px}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>名單管理</h1>
  <p class="sub">fund-hub 的 Email 名單。請勿將此頁網址與金鑰外流。</p>

  <div id="gate" class="card">
    <div class="row">
      <input id="k" type="password" placeholder="管理金鑰" autocomplete="off">
      <button class="p" id="go">讀取</button>
    </div>
    <div id="err" class="err"></div>
  </div>

  <div id="owrap" class="card hide">
    <h2>待確認贊助 <span id="ocount" class="tag tri"></span></h2>
    <p class="hint">對完帳按「確認」，系統會自動把這個信箱加進學員名單，對方重新整理就開通。</p>
    <table><thead><tr>
      <th>Email</th><th>金額</th><th>末 5 碼</th><th>備註</th><th>回報時間</th><th></th>
    </tr></thead><tbody id="ob"></tbody></table>
  </div>

  <div id="main" class="card hide">
    <div class="row">
      <button class="p" id="csv">匯出 CSV</button>
      <button id="reload">重新讀取</button>
      <input id="q" type="text" placeholder="搜尋 Email 或稱呼">
    </div>
    <div class="stat">
      <div>帳號數<b id="t">—</b></div>
      <div>學員<b id="s">—</b></div>
      <div>可寄送<b id="c">—</b></div>
    </div>
    <table><thead><tr>
      <th>Email</th><th>稱呼</th><th>驗證</th><th>方案</th><th>行銷同意</th><th>加入時間</th><th></th>
    </tr></thead><tbody id="tb"></tbody></table>
  </div>

  <div id="swrap" class="card mt hide">
    <h2>學員名單</h2>
    <p class="hint">一行一個 Email，或用逗號分隔。這份清單會整份覆寫，貼上後請確認是完整名單而不是增量。
      清單裡的人登入後永久開通；其他人為 <span id="td">14</span> 天體驗期。</p>
    <textarea id="sl" placeholder="student1@gmail.com&#10;student2@gmail.com"></textarea>
    <div class="row" style="margin-top:10px">
      <button class="p" id="ssave">儲存學員名單</button>
      <span id="smsg" class="hint" style="margin:0"></span>
    </div>
  </div>
</div>

<script>
(function(){
  var $=function(i){return document.getElementById(i);};
  var KEY="fh-admin-key", rows=[], studs=[];
  var orders=[], localStatus={};   // 這一輪自己改過的狀態，蓋過可能讀到舊版的 Blob
  function fmtOrders(){
    var pend=orders.filter(function(o){return o.status==="pending";});
    $("ocount").textContent=pend.length?pend.length+" 筆待處理":"目前沒有";
    var show=orders.slice().sort(function(a,b){
      if((a.status==="pending")!==(b.status==="pending")) return a.status==="pending"?-1:1;
      return String(b.at||"").localeCompare(String(a.at||""));
    });
    $("ob").innerHTML=show.map(function(o){
      var st=o.status==="confirmed"?'<span class="tag stu">已確認</span>'
           :o.status==="rejected"?'<span class="tag exp">已駁回</span>':"";
      var act=o.status==="pending"
        ? '<button class="p" data-ok="'+esc(o.email)+'">確認</button> '+
          '<button class="d" data-no="'+esc(o.email)+'">駁回</button>'
        : st;
      return "<tr><td class=\"e\">"+esc(o.email)+"</td><td>$"+esc(o.amount)+"</td>"+
        "<td class=\"e\">"+esc(o.last5)+"</td><td>"+esc(o.note||"")+"</td>"+
        "<td>"+esc(fmt(o.at))+"</td><td>"+act+"</td></tr>";
    }).join("");
  }
  async function loadOrders(){
    var r=await fetch("/api/admin?action=orders&key="+encodeURIComponent(key()));
    var j=await r.json();
    if(j.error) throw new Error(j.error);
    orders=(j.orders||[]).map(function(o){
      if(localStatus[o.email]) o.status=localStatus[o.email];
      return o;
    });
    $("owrap").classList.remove("hide");
    fmtOrders();
  }
  function consentTag(r){
    // 退訂優先顯示：就算當初勾過同意，退訂之後就是不能寄
    if(r.optout) return "<span class=\"tag exp\">已退訂</span>";
    return "<span class=\"tag "+(r.consent?"yes":"no")+"\">"+(r.consent?"是":"否")+"</span>";
  }
  function planTag(r){
    if(r.plan==="student") return "<span class=\"tag stu\">學員</span>";
    if(!r.active) return "<span class=\"tag exp\">已到期</span>";
    return "<span class=\"tag tri\">體驗 "+(r.daysLeft==null?"":r.daysLeft+" 天")+"</span>";
  }
  function splitEmails(s){
    return String(s||"").split(/[\s,;]+/).map(function(x){return x.trim();}).filter(Boolean);
  }
  async function saveStudents(arr){
    var r=await fetch("/api/admin?action=students-set&key="+encodeURIComponent(key()),{
      method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({emails:arr})});
    var j=await r.json();
    if(j.error) throw new Error(j.error);
    studs=j.emails||[];
    return studs;
  }
  function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[m];});}
  function fmt(iso){ if(!iso) return ""; var d=new Date(iso); return isNaN(d)?iso:
    d.toLocaleString("zh-TW",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}); }
  function key(){ return sessionStorage.getItem(KEY)||""; }

  function paint(){
    var q=($("q").value||"").trim().toLowerCase();
    var list=rows.filter(function(r){
      if(!q) return true;
      return (r.email||"").toLowerCase().indexOf(q)>=0 || (r.name||"").toLowerCase().indexOf(q)>=0;
    });
    $("tb").innerHTML=list.map(function(r){
      return "<tr><td class=\"e\">"+esc(r.email)+"</td><td>"+esc(r.name||"")+"</td>"+
        "<td><span class=\"tag "+(r.via==="google"?"g":"m")+"\">"+(r.via==="google"?"Google":"自填")+"</span></td>"+
        "<td>"+planTag(r)+"</td>"+
        "<td>"+consentTag(r)+"</td>"+
        "<td>"+esc(fmt(r.at))+"</td>"+
        "<td>"+(r.plan==="student"
          ? "<button data-un=\""+esc(r.email)+"\">取消學員</button>"
          : "<button data-up=\""+esc(r.email)+"\">設為學員</button>")+
        " <button class=\"d\" data-del=\""+esc(r.email)+"\">刪除</button></td></tr>";
    }).join("");
  }

  async function load(){
    var r=await fetch("/api/admin?action=list&key="+encodeURIComponent(key()));
    if(r.status===401){ throw new Error("金鑰不正確"); }
    var j=await r.json();
    if(j.error) throw new Error(j.error);
    rows=j.rows||[];
    $("t").textContent=j.total;
    $("c").textContent=(j.rows||[]).filter(function(x){return x.consent && !x.optout;}).length;
    $("s").textContent=j.students;
    if(j.trialDays) $("td").textContent=j.trialDays;
    var sr=await fetch("/api/admin?action=students&key="+encodeURIComponent(key()));
    var sj=await sr.json();
    studs=sj.emails||[];
    $("sl").value=studs.join("\n");
    $("swrap").classList.remove("hide");
    paint();
    try{ await loadOrders(); }catch(e){}
  }

  $("go").addEventListener("click", async function(){
    $("err").textContent="";
    sessionStorage.setItem(KEY, $("k").value.trim());
    try{ await load(); $("gate").classList.add("hide"); $("main").classList.remove("hide"); }
    catch(e){ $("err").textContent=String(e.message||e); }
  });
  $("k").addEventListener("keydown",function(e){ if(e.key==="Enter") $("go").click(); });
  $("reload").addEventListener("click",function(){ load().catch(function(e){ alert(e.message); }); });
  $("q").addEventListener("input", paint);
  $("csv").addEventListener("click", function(){
    location.href="/api/admin?action=csv&key="+encodeURIComponent(key());
  });
  $("ssave").addEventListener("click", async function(){
    var btn=this; btn.disabled=true; $("smsg").textContent="儲存中…";
    try{
      var arr=await saveStudents(splitEmails($("sl").value));
      $("sl").value=arr.join("\n");
      $("smsg").textContent="已儲存 "+arr.length+" 位學員";
      await load();
    }catch(err){ $("smsg").textContent="失敗："+err.message; }
    btn.disabled=false;
  });

  document.addEventListener("click", async function(e){
    var okb=e.target.closest("button[data-ok]"), nob=e.target.closest("button[data-no]");
    if(okb||nob){
      var em=(okb||nob).getAttribute(okb?"data-ok":"data-no");
      if(nob && !confirm("駁回 "+em+" 的贊助回報？")) return;
      (okb||nob).disabled=true;
      var r=await fetch("/api/admin?action=order-set&status="+(okb?"confirmed":"rejected")+
        "&email="+encodeURIComponent(em)+"&key="+encodeURIComponent(key()));
      var j=await r.json();
      if(j.error){ alert(j.error); (okb||nob).disabled=false; return; }
      localStatus[em]=okb?"confirmed":"rejected";
      await load();
      return;
    }
    var up=e.target.closest("button[data-up]"), un=e.target.closest("button[data-un]");
    if(up||un){
      var em=(up||un).getAttribute(up?"data-up":"data-un");
      (up||un).disabled=true;
      var next=up ? studs.concat([em]) : studs.filter(function(x){return x!==em;});
      try{ await saveStudents(next); $("sl").value=studs.join("\n"); await load(); }
      catch(err){ alert(err.message); (up||un).disabled=false; }
      return;
    }
    var b=e.target.closest("button[data-del]"); if(!b) return;
    var em=b.getAttribute("data-del");
    if(!confirm("刪除 "+em+" 的名單與自選清單？此動作無法復原。")) return;
    b.disabled=true;
    var r=await fetch("/api/admin?action=delete&email="+encodeURIComponent(em)+"&key="+encodeURIComponent(key()));
    var j=await r.json();
    if(j.error){ alert(j.error); b.disabled=false; return; }
    load();
  });

  if(key()){ $("k").value=key(); $("go").click(); }
})();
</script>
</body>
</html>
